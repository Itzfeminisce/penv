name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: contains(matrix.target, 'linux')
        run: cargo install cross --locked
      - run: ${{ contains(matrix.target, 'linux') && 'cross' || 'cargo' }} build --release --locked -p penv --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out=target/${{ matrix.target }}/release
          name=penv-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "dist/$name.zip" "./$out/penv.exe" >/dev/null
          else
            tar -C "$out" -czf "dist/$name.tar.gz" penv
          fi
          (cd dist && sha256sum "$name".* > "$name.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
