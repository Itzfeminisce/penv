name = "ts"
output = "src/env.ts"
detect = ["package.json", "tsconfig.json"]
import = "import { env } from \"{specifier}\""
paths_from = "tsconfig.json"

[options]
key_case = "upper"
runtime = "node"

[[option]]
name = "key_case"
default = "upper"
values = ["upper", "camel"]
about = "Property names in the exported object: the environment key, or its camel form."

[[option]]
name = "runtime"
default = "node"
values = ["node", "vite", "deno"]
about = "The accessor every key is read through: process.env, import.meta.env or Deno.env.get."

[[suggest]]
option = "runtime"
prompt = "which runtime reads the env?"

[[suggest.rule]]
value = "vite"
files = [
  "vite.config.js",
  "vite.config.mjs",
  "vite.config.cjs",
  "vite.config.ts",
  "vite.config.mts",
]

[[suggest.rule]]
value = "deno"
files = ["deno.json", "deno.jsonc"]

[types]
string = "string"
number = "number"
integer = "number"
boolean = "boolean"
url = "string"
email = "string"
port = "number"
enum = "values | map('quote') | join(' | ')"

[check]
command = ["tsc", "--noEmit", "--strict", "--skipLibCheck", "--target", "es2020", "--module", "esnext", "--moduleResolution", "bundler", "{file}", "penv-globals.d.ts"]
probe = ["tsc", "--version"]
bin = ["node_modules/.bin"]

[check.files]
"penv-globals.d.ts" = """
declare const process: { env: Record<string, string | undefined> };
declare const Deno: { env: { get(key: string): string | undefined } };
declare const URL: { new (url: string): unknown };
interface ImportMeta { readonly env: Record<string, string | undefined> }
"""
