name = "cursor"
description = "Cursor CLI deny rules and a beforeReadFile hook that fails closed."
scope = "project"
detect = [".cursor", "~/.cursor"]
exe = ["cursor"]

[[write]]
path = ".cursor/cli.json"
format = "json"
merge = "deny-union"
template = "cli.json.tmpl"

[[write]]
path = ".cursor/hooks.json"
format = "json"
merge = "deny-union"
union = ["beforeReadFile", "beforeShellExecution"]
template = "hooks.json.tmpl"
