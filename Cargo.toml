[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Itzfeminisce/penvhq"
authors = ["penv"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
penv-schema = { path = "crates/penv-schema", version = "1.0.0-alpha.1" }
penv-dotenv = { path = "crates/penv-dotenv", version = "1.0.0-alpha.1" }
